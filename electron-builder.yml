appId: com.vaultbay.app
productName: VaultBay
copyright: Copyright © VaultBay
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Auto-update via GitHub Releases
publish:
  provider: github
  owner: LogicRepairs
  repo: vaultbay
  releaseType: release

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: VaultBay-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: VaultBay-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VaultBay
  uninstallDisplayName: VaultBay
  artifactName: VaultBay-${version}-win-setup-${arch}.${ext}

portable:
  artifactName: VaultBay-${version}-win-portable-${arch}.${ext}

linux:
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: VaultBay-${version}-linux-${arch}.${ext}
  desktop:
    Name: VaultBay
    Comment: NAS control for spare drives
    Categories: Utility;

appImage:
  artifactName: VaultBay-${version}-linux-portable-${arch}.AppImage
